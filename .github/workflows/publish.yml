name: Publish CLI

# Every cli-vX.Y.Z tag, such as cli-v1.2.0, publishes the CLI (bun-lock-submission)
# to npm. The tag must match the version in packages/cli/package.json and point to
# a commit on main. The action is released separately, with vX.Y.Z tags and a vX
# major tag, which this workflow ignores; see Releasing in the README.
#
# A release goes out through npm trusted publishing with provenance, or not at
# all: npm trusts this workflow's OIDC token (the trusted publisher on npmjs.com
# names this repository, publish.yml and the npm environment), and no npm token
# is stored anywhere. Trusted publishing stages the release: it becomes
# installable once a maintainer approves it, with 2FA, on npmjs.com.
on:
  push:
    tags: ['cli-v[0-9]+.[0-9]+.[0-9]+*']

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/bun-lock-submission
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the release
        env:
          PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
        run: |
          version=$(jq -r .version packages/cli/package.json)
          if [ "$GITHUB_REF_NAME" != "cli-v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match $version in packages/cli/package.json."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to a commit that is not on main."
            exit 1
          fi
          # npm refuses provenance from a private repository.
          if [ "$PRIVATE_REPOSITORY" != false ]; then
            echo "::error::Provenance needs a public repository; $GITHUB_REPOSITORY is not public."
            exit 1
          fi

      # No dependency cache: this job can publish, so its packages come from the
      # registry, not from a cache another job saved.
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # Trusted publishing needs the npm CLI 11.5.1 or later, which Node.js 24 ships.
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run type-check && bun run test

      # npm checks bin paths before running prepack, so the bundle must exist first.
      - name: Build
        run: bun run --filter bun-lock-submission build

      - name: Publish
        working-directory: packages/cli
        run: |
          # A prerelease such as 1.0.0-beta.1 goes out under `next`, never as `latest`.
          case "$(jq -r .version package.json)" in
            *-*) tag=next ;;
            *) tag=latest ;;
          esac
          # prepack builds dist/ and copies README.md and LICENSE from the root.
          npm publish --provenance --access public --tag "$tag"
