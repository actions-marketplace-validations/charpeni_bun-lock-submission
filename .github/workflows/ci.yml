name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Oxlint
            run: bun run lint
          - name: Oxfmt
            run: bun run format:check
          - name: TypeScript
            run: bun run type-check
          - name: Tests
            run: bun run test
          # npx runs the CLI on Node.js, while the tests run on Bun.
          # npm publish silently drops package.json fields it would correct, such as a
          # bin path starting with ./, so the manifest must already be what npm wants.
          - name: CLI on Node.js
            run: |
              bun run --filter bun-lock-submission build
              (cd packages/cli && npm pkg fix)
              if ! git diff --exit-code -- packages/cli/package.json; then
                echo "::error::npm would rewrite packages/cli/package.json when publishing. Run \`npm pkg fix\` in packages/cli and commit the result."
                exit 1
              fi
              node packages/cli/dist/cli.mjs snapshot bun.lock > "$RUNNER_TEMP/snapshot.json"
              jq -e '.manifests["bun.lock"].resolved | length > 0' "$RUNNER_TEMP/snapshot.json"
          # GitHub runs the committed bundle, so it must match the source.
          - name: Action bundle
            run: |
              bun run --filter @bun-lock-submission/action build
              if ! git diff --exit-code -- packages/action/dist; then
                echo "::error::packages/action/dist is out of date. Run \`bun run build\` and commit the result."
                exit 1
              fi

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.run }}

  action:
    name: Action dry run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the action without submitting
        id: dry-run
        uses: ./
        with:
          lockfiles: bun.lock
          dry-run: true

      - name: Check its outputs
        env:
          RESULT: ${{ steps.dry-run.outputs.result }}
          SNAPSHOT_PATH: ${{ steps.dry-run.outputs.snapshot-path }}
        run: |
          test "$RESULT" = DRY_RUN
          jq -e '.manifests["bun.lock"].resolved | length > 0' "$SNAPSHOT_PATH"
