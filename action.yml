name: Bun Lock Submission
description: Submit bun.lock dependencies to GitHub's dependency graph, so Dependabot alerts cover transitive dependencies.
author: charpeni

branding:
  icon: shield
  color: gray-dark

inputs:
  working-directory:
    description: Directory to search for bun.lock files, relative to the repository root.
    required: false
    default: '.'
  lockfiles:
    description: >-
      Lockfiles to submit, one per line, relative to working-directory. Defaults to every
      bun.lock under working-directory, outside node_modules.
    required: false
    default: ''
  layout:
    description: >-
      "lockfile" reports dependencies against each bun.lock. "workspaces" reports them
      against each workspace package.json, replacing GitHub's static analysis of those files.
    required: false
    default: lockfile
  include-exact-pins:
    description: >-
      In the lockfile layout, also submit direct dependencies that every package.json pins
      to the locked version. GitHub already alerts on those through package.json, so this
      duplicates their alerts.
    required: false
    default: 'false'
  exclude:
    description: Package names to leave out, such as private packages, one per line or comma-separated. "*" matches any characters.
    required: false
    default: ''
  correlator:
    description: >-
      Snapshot group. Each submission replaces the previous one with the same correlator,
      so use a different value for each step that submits a different set of lockfiles.
    required: false
    default: bun-lock-submission
  token:
    description: Token used to submit the snapshot. Needs the contents write permission.
    required: false
    default: ${{ github.token }}
  dry-run:
    description: Write the snapshot to a file instead of submitting it.
    required: false
    default: 'false'

outputs:
  result:
    description: GitHub's answer, SUCCESS or ACCEPTED, or DRY_RUN.
  snapshot-id:
    description: The ID of the submitted snapshot.
  manifests:
    description: How many manifests the snapshot contains.
  packages:
    description: How many packages were submitted, counted once per lockfile.
  snapshot-path:
    description: In a dry run, the path of the snapshot file.

runs:
  using: node24
  main: packages/action/dist/index.mjs
